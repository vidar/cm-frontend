# Client authentication for the chessmoments.com database (installed by install.sh; the original
# Debian file is kept as pg_hba.conf.orig). First match wins; anything not listed is refused.
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer
# root runs imports, maintenance and restores as cm_owner (never as a superuser: nothing from a dump runs as one).
local   cm_games,cm_games_restore,cm_games_drill cm_owner           peer map=cm
# Hyperdrive reaches Postgres through the Cloudflare Tunnel (cloudflared on this box -> 127.0.0.1); TLS only.
# Tunnel traffic arrives from 127.0.0.1 like local tools do, so no other role may log in over loopback:
# imports and maintenance on this box use the socket (the two lines above).
hostssl cm_games        cm_web          127.0.0.1/32            scram-sha-256
hostssl cm_games        cm_web          ::1/128                 scram-sha-256
@TAILNET@
