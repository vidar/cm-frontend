# Drop-in for system-postgresql.slice, where every postgresql@ cluster runs (installed by install.sh as
# /etc/systemd/system/system-postgresql.slice.d/50-chessmoments.conf). The weight competes with the other
# services on the box: page requests win over engine analysis and video renders when the CPUs are busy
# (with stockfish-svc at CPUWeight=50 and render-svc at 20, game pages measured p95 10.7 ms under full
# load, 23.8 ms with equal weights). No swap for the database: a page request must never wait on the
# disk for memory that was swapped out; the neighbours' cold pages go to swap instead.
[Slice]
CPUWeight=500
MemorySwapMax=0
