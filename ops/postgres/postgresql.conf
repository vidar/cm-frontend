# chessmoments.com games database on hetz-stock (installed as conf.d/50-chessmoments.conf by install.sh).
# The box (4 vCPU, 7.6 GB RAM) is shared with stockfish-svc (~1.2 GB) and render-svc (up to 2.5 GB), so
# Postgres keeps to about 1 GB of its own memory and leans on the OS page cache for the ~3 GB database.
# listen_addresses is written by install.sh (60-listen.conf): localhost, plus the Tailscale IP if asked.

# Connections: Hyperdrive's pool (origin connection limit 20, a soft cap; cm_web is capped at 40 in
# install.sh) + imports, backups, admin.
max_connections = 60
superuser_reserved_connections = 3

# Memory
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB
autovacuum_work_mem = 64MB
wal_buffers = 16MB
huge_pages = off
jit = off                                # short OLTP queries: JIT only adds latency

# Hetzner cloud volumes are SSD-backed
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL and checkpoints: few writes; keep checkpoints calm during imports
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Parallelism: leave CPU for the engine workers
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 2

# Security
password_encryption = scram-sha-256

# Logging (journal / /var/log/postgresql): slow queries, checkpoints, lock waits, temp spills
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 16MB
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %q%u@%d '

# Hyperdrive keeps idle pooled connections open over the tunnel: notice dead peers within minutes
tcp_keepalives_idle = 60
tcp_keepalives_interval = 15
tcp_keepalives_count = 4
