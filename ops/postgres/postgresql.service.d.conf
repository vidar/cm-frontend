# Drop-in for postgresql@.service (installed by install.sh as postgresql@.service.d/50-chessmoments.conf).
# Debian's unit already protects the postmaster from the OOM killer (pg_ctlcluster sets -900 and puts the
# backends back to 0) and replaces the environment from /etc/postgresql/<ver>/main/environment.
# No MemoryMax: hitting it would kill a backend and restart every session (crash recovery).
# CPU priority over the engine and renders is set on the slice (postgresql-slice.conf): a weight here
# would only compete with other PostgreSQL clusters.
[Service]
# The kernel OOM killer taking one backend must not make systemd stop the whole cluster (the default
# OOMPolicy=stop): the postmaster recovers from it by itself within seconds.
OOMPolicy=continue
# And if the postmaster itself dies, start it again (Debian leaves Restart off).
Restart=on-failure
RestartSec=5s
