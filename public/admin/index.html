    openssl dgst -sha384 -binary package/dist/sveltia-cms.js | openssl base64 -A -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.253.2/dist/sveltia-cms.js"
      integrity="sha384-b3NfLhuFjiXL+mJgdgGU9YvgmJVl+BSiNNuK4Exr/Eg4CgvWVt4BhYSI5rJ5TtgA"
      crossorigin="anonymous"
      type="module"></script>
